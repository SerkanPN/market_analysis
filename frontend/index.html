<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopee Store Analyzer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Shopee Store Analyzer 📊</h1>
            <p>Enter a Shopee Indonesia store URL to get a full analysis.</p>
        </header>
        <main>
            <div class="input-group">
                <input type="text" id="storeUrl" placeholder="e.g., https://shopee.co.id/unileverindonesia" />
                <button id="analyzeBtn">Analyze</button>
            </div>
            <div id="loader" class="loader hidden"></div>
            <div id="resultsContainer"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
