<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Pulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Market Pulse 📈</h1>
            <p>Your Simple E-commerce Analysis Tool</p>
        </header>

        <main>
            <!-- Shopee Analysis Module -->
            <div class="module">
                <h2>Module A: Shopee Indonesia Analysis</h2>
                <div class="input-group">
                    <input type="text" id="shopeeKeyword" placeholder="e.g., sepatu pria">
                    <button id="analyzeShopeeBtn">Analyze</button>
                </div>
                <div id="shopeeLoader" class="loader hidden"></div>
                <table id="shopeeResultsTable" class="hidden">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Units Sold</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results will be injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Shopify Integration Module -->
            <div class="module">
                <h2>Module B: Shopify Integration</h2>
                <button id="fetchShopifyBtn">Fetch Shopify Store Products</button>
                <div id="shopifyLoader" class="loader hidden"></div>
                <table id="shopifyResultsTable" class="hidden">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
